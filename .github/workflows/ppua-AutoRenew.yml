name: 🔄 PPUA AutoRenew

on:
  schedule:
    - cron: '43 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    # 这是「上限」不是预期耗时：单域名最坏 15 轮 × 30s ≈ 8 分钟，多账号 × 多域名串行时
    # 90 分钟会被硬切断（切断后 artifact 有、TG 报告没有）。GitHub 单 job 上限 360。
    timeout-minutes: 350
    concurrency:
      group: ppua # 这里如果部署多个yml,也要修改这里
      cancel-in-progress: true
    env:
      # ============================================================
      # ★ 模型：代码仓（只读，开发者私有） + 你的私有 Gist（存 domain_phones，加密）
      #   - PRIVATE_REPO       开发者私有代码仓地址（固定，不改）
      #   - PRIVATE_REPO_TOKEN 开发者发的只读 Fine-grained PAT（已存在于 Secret）
      #   - GIST_ID            你的私有 gist id（存 domain_phones）
      #   - GIST_PAT           classic PAT（gist scope，只能写你的 gist）
      #   - STATE_ENCRYPT_KEY  Fernet 密钥（加解密 domain_phones）
      #   TG 会话：仅从 TG_LOGIN_BATCH(secret) 的 session 字段读取，不落仓库/Gist
      # ============================================================
      PRIVATE_REPO: jyucoeng/ppua-auto-private
      APP_DIR: code
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      # ---- 域名归属持久化（私有 Gist）----
      GIST_ID: ${{ secrets.GIST_ID || '0d6c6b5025840f15493fb70539dfe57d' }}
      # ⚠️ 上面的 GIST_ID 是作者自己的私有 gist，**使用者不要照抄**！请创建你自己的私有 gist，每一个yml都需要不一样的 GIST_ID
      #    （gist.github.com → Create secret gist → 文件 domain_phones.json → 内容 {}），
      #    把 URL 末尾的 id 填到你自己仓库的 Secrets → GIST_ID 覆盖。
      GIST_PAT: ${{ secrets.GIST_PAT }}                    # Secret：classic PAT(gist scope)
      STATE_ENCRYPT_KEY: ${{ secrets.STATE_ENCRYPT_KEY }}
      # ---- 账号（多账号，见 README：email,password[,tg_token,tg_chat][#白名单|白名单2|白名单3|更多名单][!黑名单｜黑名单2｜黑名单3|更多名单]);email1,password2[,tg_token2,tg_chat2][#白名单|白名单2|白名单3|更多名单][!黑名单｜黑名单2｜黑名单3|更多名单]）----
      NICUA_BATCH: ${{ secrets.NICUA_BATCH }}
      # ---- TG 用户会话注册表（setup_tg_session.py 输出）----
      TG_LOGIN_BATCH: ${{ secrets.TG_LOGIN_BATCH }}
      # ---- 代理出口（可选；URL=Secret，端口=Secret）----
      PROXY_CONTENT: ${{ secrets.PROXY_CONTENT }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      # ---- 阶段 E 域名监控（开关/标签=Secrets 可自定义带默认值；URL/密码=Secrets）----
      # DASHBOARD_SYNC_ENABLED=true=--开启阶段 E 域名监控，关闭用false
      DASHBOARD_SYNC_ENABLED: ${{ secrets.DASHBOARD_SYNC_ENABLED || 'true' }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      DASHBOARD_LABEL: ${{ secrets.DASHBOARD_LABEL || '域名监控同步' }}
      DASHBOARD_GROUP: ${{ secrets.DASHBOARD_GROUP || 'nic.ua' }}
      # ---- 阶段 F RenewHelper（开关/标签=Secrets 可自定义带默认值；URL/密码=Secrets）----
      # RENEWHELPER_SYNC_ENABLED=true=--开启阶段 F RenewHelper，关闭用false
      RENEWHELPER_SYNC_ENABLED: ${{ secrets.RENEWHELPER_SYNC_ENABLED || 'true' }}
      RENEWHELPER_URL: ${{ secrets.RENEWHELPER_URL }}
      RENEWHELPER_PASSWORD: ${{ secrets.RENEWHELPER_PASSWORD }}
      RENEWHELPER_LABEL: ${{ secrets.RENEWHELPER_LABEL || 'RenewHelper同步' }}
      RENEWHELPER_TAG_DOMAIN: ${{ secrets.RENEWHELPER_TAG_DOMAIN || 'true' }}
      RENEWHELPER_GROUP: ${{ secrets.RENEWHELPER_GROUP || '域名' }}
      # ---- 其它 ----
      APP_TIMEZONE: ${{ secrets.APP_TIMEZONE || 'Asia/Shanghai' }}
      GATE_BEFORE: ${{ secrets.GATE_BEFORE || 'none' }}
      # 全局学习：COLLECT_TG_FOR_DOMAIN=true 时不续期只收集「域名↔归属手机号」；
      # 「域名↔手机号」映射只需要全局学习**一次**。改成true学全后改回 false，关闭本收集（默认 false 关闭）
      COLLECT_TG_FOR_DOMAIN: ${{ secrets.COLLECT_TG_FOR_DOMAIN || 'true' }}
      # 域名列表截图开关：SHOW_DOMAIN_LIST=true(默认 true) 时每账号处理完生成「域名列表」长图并发送到 TG；
      # =false 时不生成域名列表截图、也不发送该截图
      SHOW_DOMAIN_LIST: ${{ secrets.SHOW_DOMAIN_LIST || 'true' }}

    steps:
      - name: 检出触发/公开仓库
        uses: actions/checkout@v4

      - name: 校验必填配置
        run: |
          set -u
          [ -n "$PRIVATE_REPO_TOKEN" ] || { echo "❌ PRIVATE_REPO_TOKEN 未配置（开发者发的只读 PAT）"; exit 1; }
          [ -n "$GIST_ID" ]            || { echo "❌ GIST_ID 未配置（你私有 gist 的 id）"; exit 1; }
          [ -n "$GIST_PAT" ]           || { echo "❌ GIST_PAT 未配置（classic PAT，gist scope）"; exit 1; }
          [ -n "$NICUA_BATCH" ]        || { echo "❌ NICUA_BATCH 未配置"; exit 1; }
          if [ -z "$STATE_ENCRYPT_KEY" ]; then
            echo "⚠️ STATE_ENCRYPT_KEY 未配置：TG 会话不会落盘、domain_phones 可能明文存入 gist"
          fi
          # PAT 过期/未授权时，checkout 只会报 "Repository not found"，极难排查 → 先探一次
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO")
          if [ "$code" != "200" ]; then
            echo "❌ PRIVATE_REPO_TOKEN 无法访问 $PRIVATE_REPO（HTTP $code）：PAT 已过期或未授权该私有仓"
            exit 1
          fi

      - name: 检出开发者私有代码仓（只读）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.APP_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install seleniumbase==4.54.1 pyvirtualdisplay==3.0 requests==2.34.2 telethon==1.45.0 pysocks==1.7.1 "python-socks[asyncio]==3.1.1" cryptography==50.0.1 pillow
          fi

      - name: 安装 sing-box（代理出口）
        working-directory: ${{ env.APP_DIR }}
        run: |
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}s"
          sleep $delay

      - name: 执行 PPUA 续期
        working-directory: ${{ env.APP_DIR }}
        run: python ppua_renew.py

      - name: 上传审计产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppua-artifacts-${{ github.run_id }}
          path: |
            ${{ env.APP_DIR }}/sing-box_config.json
            ${{ env.APP_DIR }}/socks5_proxy.txt
            ${{ env.APP_DIR }}/proxy_result.json
            ${{ env.APP_DIR }}/screenshots/**/*
          # 公开仓 artifact 保留期上限 90 天（超过会被服务端拒绝/静默截断），
          # 400 天也没有意义：审计截图只服务于最近几次排查。
          retention-days: 30
          if-no-files-found: warn

      - name: 清理本地审计产物
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          # state/：write_state_session 产生的会话缓存（含加密后的 session）
          # use_external_socks.txt：旧版 parse_socks5 的残留副作用文件
          rm -rf screenshots sing-box_config.json socks5_proxy.txt proxy_result.json \
                 use_external_socks.txt state __pycache__ || true

      - name: 提交执行时间
        if: always()
        # time.txt 只是「保活用」的提交：分支保护 / 并发 rebase 冲突不该把整轮标记为失败
        # （此时续期与 TG 报告早已完成）
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ppua && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ppua/time.txt
          git add ppua/time.txt
          if git diff --cached --quiet; then
            echo "time.txt 无变化"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 1
          keep_minimum_runs: 2
