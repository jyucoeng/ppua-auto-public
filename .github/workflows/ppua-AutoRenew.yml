name: 🔄 PPUA AutoRenew

on:
  schedule:
    - cron: '43 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ppua
      cancel-in-progress: false
    env:
      # ============================================================
      # ★ 模型：代码仓（只读，开发者私有） + 你的私有 Gist（存 domain_phones，加密）
      #   - PRIVATE_REPO       开发者私有代码仓地址（固定，不改）
      #   - PRIVATE_REPO_TOKEN 开发者发的只读 Fine-grained PAT（已存在于 Secret）
      #   - GIST_ID            你的私有 gist id（存 domain_phones）
      #   - GIST_PAT           classic PAT（gist scope，只能写你的 gist）
      #   - STATE_ENCRYPT_KEY  Fernet 密钥（加解密 domain_phones）
      #   TG 会话：仅从 TG_LOGIN_BATCH(secret) 的 session 字段读取，不落仓库/Gist
      # ============================================================
      PRIVATE_REPO: jyucoeng/ppua-auto-private
      APP_DIR: code
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      # ---- 域名归属持久化（私有 Gist）----
      GIST_ID: ${{ vars.GIST_ID || '0d6c6b5025840f15493fb70539dfe57d' }}
      # ⚠️ 上面的 GIST_ID 是作者自己的私有 gist，**使用者不要照抄**！请创建你自己的私有 gist
      #    （gist.github.com → Create secret gist → 文件 domain_phones.json → 内容 {}），
      #    把 URL 末尾的 id 填到你自己仓库的 Variables → GIST_ID 覆盖。
      GIST_PAT: ${{ secrets.GIST_PAT }}                    # Secret：classic PAT(gist scope)
      STATE_ENCRYPT_KEY: ${{ secrets.STATE_ENCRYPT_KEY }}
      # ---- 账号（多账号，见 README：email,password[,tg_token,tg_chat][#白名单;...][!黑名单;...]）----
      NICUA_BATCH: ${{ secrets.NICUA_BATCH_XIONG2 }}
      # ---- TG 用户会话注册表（setup_tg_session.py 输出，含 session 串；不落仓库）----
      TG_LOGIN_BATCH: ${{ secrets.TG_LOGIN_BATCH_XIONG2 }}
      # ---- 代理出口（可选；URL=Secret，端口=Variables）----
      PROXY_CONTENT: ${{ secrets.PROXY_CONTENT }}
      SOCKS_PORT: ${{ vars.SOCKS_PORT || '10808' }}
      # ---- 阶段 E 域名监控（开关=仓库变量 vars；URL/密码=Secrets；标签可自定义）----
      DASHBOARD_SYNC_ENABLED: ${{ vars.DASHBOARD_SYNC_ENABLED || 'true' }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      DASHBOARD_LABEL: ${{ vars.DASHBOARD_LABEL || '域名监控同步' }}
      DASHBOARD_GROUP: ${{ vars.DASHBOARD_GROUP || 'nic.ua' }}
      # ---- 阶段 F RenewHelper（开关=仓库变量 vars；URL/密码=Secrets；标签可自定义）----
      RENEWHELPER_SYNC_ENABLED: ${{ vars.RENEWHELPER_SYNC_ENABLED || 'true' }}
      RENEWHELPER_URL: ${{ secrets.RENEWHELPER_URL }}
      RENEWHELPER_PASSWORD: ${{ secrets.RENEWHELPER_PASSWORD }}
      RENEWHELPER_LABEL: ${{ vars.RENEWHELPER_LABEL || 'RenewHelper同步' }}
      RENEWHELPER_TAG_DOMAIN: ${{ vars.RENEWHELPER_TAG_DOMAIN || 'true' }}
      RENEWHELPER_GROUP: ${{ vars.RENEWHELPER_GROUP || '域名' }}
      # ---- 其它 ----
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Asia/Shanghai' }}
      GATE_BEFORE: ${{ vars.GATE_BEFORE || 'none' }}
      # 全局学习：COLLECT_TG_FOR_DOMAIN=true 时不续期只收集「域名↔归属手机号」；
      # 「域名↔手机号」映射只需要全局学习**一次**。学全后改回 false，关闭本收集（默认 false）
      COLLECT_TG_FOR_DOMAIN: ${{ vars.COLLECT_TG_FOR_DOMAIN || 'false' }}

    steps:
      - name: 检出触发/公开仓库
        uses: actions/checkout@v4

      - name: 校验必填配置
        run: |
          set -u
          [ -n "$PRIVATE_REPO_TOKEN" ] || { echo "❌ PRIVATE_REPO_TOKEN 未配置（开发者发的只读 PAT）"; exit 1; }
          [ -n "$GIST_ID" ]            || { echo "❌ GIST_ID 未配置（你私有 gist 的 id）"; exit 1; }
          [ -n "$GIST_PAT" ]           || { echo "❌ GIST_PAT 未配置（classic PAT，gist scope）"; exit 1; }
          if [ -z "$STATE_ENCRYPT_KEY" ]; then
            echo "⚠️ STATE_ENCRYPT_KEY 未配置，domain_phones 将以明文存入 gist（不推荐）"
          fi

      - name: 检出开发者私有代码仓（只读）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.APP_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install seleniumbase==4.54.1 pyvirtualdisplay==3.0 requests==2.34.2 telethon==1.45.0 pysocks==1.7.1 "python-socks[asyncio]==3.1.1" cryptography==50.0.1 pillow
          fi

      - name: 安装 sing-box（代理出口）
        working-directory: ${{ env.APP_DIR }}
        run: |
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 10))
          echo "随机延迟: ${delay}s"
          sleep $delay

      - name: 执行 PPUA 续期
        working-directory: ${{ env.APP_DIR }}
        run: python ppua_renew.py

      - name: 上传审计产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppua-artifacts-${{ github.run_id }}
          path: |
            ${{ env.APP_DIR }}/sing-box_config.json
            ${{ env.APP_DIR }}/socks5_proxy.txt
            ${{ env.APP_DIR }}/proxy_result.json
            ${{ env.APP_DIR }}/screenshots/**/*
          retention-days: 400
          if-no-files-found: warn

      - name: 清理本地审计产物
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -rf screenshots sing-box_config.json socks5_proxy.txt proxy_result.json || true

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ppua && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ppua/time.txt
          git add ppua/time.txt
          if git diff --cached --quiet; then
            echo "time.txt 无变化"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 1
          keep_minimum_runs: 2