name: 🔄 PPUA AutoRenew

on:
  schedule:
    - cron: '43 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '干跑/心跳模式（只探活，不发单）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ppua
      cancel-in-progress: false
    env:
      # ---- 私有代码仓（代码 + state/ 加密状态同仓；多协作者可读但密文）----
      APP_DIR: ppua
      PRIVATE_REPO: jyucoeng/ppua-auto-private
      # ---- 账号（多账号，见 README：email,password[,tg_token,tg_chat][#白名单;...][!黑名单;...]）----
      NICUA_BATCH: ${{ secrets.NICUA_BATCH }}
      # ---- TG 用户会话注册表（setup_tg_session.py 输出）----
      TG_LOGIN_BATCH: ${{ secrets.TG_LOGIN_BATCH }}
      TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
      # ---- 代理出口（可选；URL=Secret，端口=Variables）----
      PROXY_CONTENT: ${{ secrets.PROXY_CONTENT }}
      SOCKS_PORT: ${{ vars.SOCKS_PORT || '10808' }}
      # ---- 阶段 E 域名监控（开关=仓库变量 vars；URL/密码=Secrets；标签可自定义）----
      DASHBOARD_SYNC_ENABLED: ${{ vars.DASHBOARD_SYNC_ENABLED || 'false' }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      DASHBOARD_LABEL: ${{ vars.DASHBOARD_LABEL || '域名监控同步' }}
      DASHBOARD_GROUP: ${{ vars.DASHBOARD_GROUP || 'nic.ua' }}
      # ---- 阶段 F RenewHelper（开关=仓库变量 vars；URL/密码=Secrets；标签可自定义）----
      RENEWHELPER_SYNC_ENABLED: ${{ vars.RENEWHELPER_SYNC_ENABLED || 'false' }}
      RENEWHELPER_URL: ${{ secrets.RENEWHELPER_URL }}
      RENEWHELPER_PASSWORD: ${{ secrets.RENEWHELPER_PASSWORD }}
      RENEWHELPER_LABEL: ${{ vars.RENEWHELPER_LABEL || 'RenewHelper同步' }}
      # ---- 其它 ----
      APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Asia/Shanghai' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # 验证门槛（默认 0=不点 apu Continue；验证完置 1 打开）
      CONTINUE_GATE: ${{ vars.CONTINUE_GATE || '0' }}

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 检出私有代码仓（含 state/，token 需有写权限用于回写）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.APP_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0 telethon>=1.34.0 pysocks cryptography
          fi

      - name: 安装 sing-box（代理出口）
        working-directory: ${{ env.APP_DIR }}
        run: |
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}s"
          sleep $delay

      - name: 执行 PPUA 续期
        working-directory: ${{ env.APP_DIR }}
        run: python ppua_renew.py

      - name: 上传审计产物（HTML/截图/代理配置）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppua-artifacts-${{ github.run_id }}
          path: |
            ${{ env.APP_DIR }}/sing-box_config.json
            ${{ env.APP_DIR }}/socks5_proxy.txt
            ${{ env.APP_DIR }}/proxy_result.json
            ${{ env.APP_DIR }}/screenshots/**/*
          retention-days: 400
          if-no-files-found: warn

      - name: 清理本地审计产物
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -rf screenshots sing-box_config.json socks5_proxy.txt proxy_result.json || true

      - name: 回写私有仓 state/（TG 会话/归属/去重，加密；与代码同仓）
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo "state 无变化"
            exit 0
          fi
          git add state/
          git commit -m "同步 state: $(date +'%Y-%m-%d %H:%M:%S')" || true
          for i in 1 2 3; do
            if git pull --rebase origin main 2>/dev/null; then
              if git push origin HEAD:main 2>/dev/null; then
                echo "✅ state 已回写（第 ${i} 次成功）"
                exit 0
              fi
              echo "[${i}] push 冲突，rebase 后重试"
            else
              echo "[${i}] pull 失败，等待重试"
            fi
            sleep 3
          done
          echo "❌ state 回写 3 次未成功，请人工处理"
          exit 1

      - name: 提交执行时间（公开仓，保 cron 存活）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ppua && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ppua/time.txt
          git add ppua/time.txt
          if git diff --cached --quiet; then
            echo "time.txt 无变化"
          else
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 14
          keep_minimum_runs: 5
